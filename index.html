<!DOCTYPE html>
<!-- Source: https://github.com/gregmarra/mbta-nearby -->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Live MBTA arrival predictions for the three nearest stops, built for Meta Ray-Ban Display glasses.">
  <meta name="mrbd-web-app-capable" content="yes">
  <title>MBTA Nearby</title>
  <link rel="icon" type="image/png" href="favicon.png" sizes="128x128">
  <!-- Crisp at any tab size in browsers. The glasses ignore it: SVG favicons
       are a documented known issue there, so the PNG above stays the one
       they use (as does the entry in manifest.webmanifest). -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <div id="home" class="screen">
      <header class="header">
        <h1 id="hdr-title">MBTA Nearby</h1>
        <span class="header-meta hidden" id="status-indicator"></span>
        <button class="header-action focusable" id="refresh-btn" data-action="refresh" aria-label="Refresh"><span class="refresh-glyph">&#x21BB;</span></button>
      </header>

      <div class="content">
        <div id="loading" class="loading-container">
          <div class="loading-spinner"></div>
          <div class="loading-text" id="loading-text">Getting location...</div>
          <div class="loading-sub" id="loading-sub">Finding nearby MBTA stops</div>
        </div>

        <div id="error" class="error-container hidden">
          <div class="error-icon">&#9888;</div>
          <div class="error-message" id="error-message">Something went wrong</div>
          <button class="nav-item focusable" data-action="refresh">Try Again</button>
        </div>

        <div id="station-list" class="station-list hidden"></div>
      </div>

      <div class="scrim-bottom"></div>
    </div>

    <!-- Station detail: opened by activating a route row; the back gesture
         returns home. One level deep: the shell calls history.back() when a
         previous entry exists, so nothing here handles Back itself. -->
    <div id="detail" class="screen hidden">
      <header class="header">
        <button class="header-action focusable" id="detail-back" data-action="back" aria-label="Back">&#x2039;</button>
        <h1 id="detail-title">Station</h1>
        <span class="header-meta" id="detail-dist"></span>
      </header>
      <div class="content focusable" id="detail-content" tabindex="0"
           role="region" aria-label="Routes at this station">
        <div id="detail-list" class="station-list"></div>
      </div>
      <div class="scrim-bottom"></div>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
